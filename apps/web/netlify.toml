# Netlify site settings: "Base directory" is apps/web, but Netlify resolves
# these paths against the repository root, so they are written repo-relative.
[build]
  base = "apps/web"
  command = "npm run build"
  publish = "apps/web/dist/web/browser"

# Proxy API calls so the browser sees one site (keeps the sameSite=strict refresh cookie working).
[[redirects]]
  from = "/api/*"
  to = "https://tournament-saas-app.onrender.com/:splat"
  status = 200
  force = true

# Client-side routes (e.g. /lobbies/123) must serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
